name: Generate Random English Lyrics & LRC

on:
  workflow_dispatch: # 手動実行
  # 定期実行したい場合はスケジュールのコメントアウトを外してください
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Lyrics, LRC and DDEX XML
        run: |
          python3 - << 'EOF'
          import csv
          import random
          import os
          from datetime import datetime

          # 1. データの読み込み (words.csv)
          csv_file = '/data/words.csv'
          if not os.path.exists(csv_file):
              csv_file = 'data/words.csv'

          words_by_pos = {'N': [], 'V': [], 'A': [], 'ADV': []}

          if os.path.exists(csv_file):
              with open(csv_file, mode='r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      word = row.get('word', '').strip()
                      pos = row.get('pos', '').strip().upper()
                      if word and pos in words_by_pos:
                          words_by_pos[pos].append(word)

          # フォールバック（データが足りない場合用）
          for pos in words_by_pos:
              if not words_by_pos[pos]:
                  words_by_pos[pos] = ['unknown']

          def get_random_word(pos):
              return random.choice(words_by_pos[pos])

          # 1.5 テンプレートの読み込み (ltempl.csv)
          templ_file = '/data/ltempl.csv'
          if not os.path.exists(templ_file):
              templ_file = 'data/ltempl.csv'

          title_templates = []
          templates = []

          if os.path.exists(templ_file):
              with open(templ_file, mode='r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      t_type = row.get('type', '').strip().lower()
                      t_text = row.get('template', '').strip().replace('\\n', '\n')
                      if t_type == 'title' and t_text:
                          title_templates.append(t_text)
                      elif t_type == 'lyric' and t_text:
                          templates.append(t_text)

          # フォールバック（テンプレートファイルが見つからない・空の場合）
          if not title_templates:
              title_templates = [
                  "Echoes of {N}",
                  "The {A} {N}",
                  "{V}ing in the {N}",
                  "Beyond the {A} {N}"
              ]
          
          if not templates:
              templates = [
                  "When the {N} falls down {ADV},\nWe {V} the {A} {N}.",
                  "In the core of the {A} {N},\nWe {ADV} {V} the {N}.",
                  "Every {A} {N} will {V},\nAs the {N} {ADV} {V}s.",
                  "Can we {V} the {A} {N}?\nSo {ADV} {A}, so {N}."
              ]

          # 2. 曲名と作詞者名の生成
          song_title = random.choice(title_templates).format(
              N=get_random_word('N'),
              V=get_random_word('V'),
              A=get_random_word('A'),
              ADV=get_random_word('ADV')
          )

          lyricist_name = f"{get_random_word('N').capitalize()} {get_random_word('N').capitalize()}"

          # 3. 曲の構成（セクション）をランダムに組み立てて歌詞を作成
          num_sections = random.randint(3, 5)
          lyrics_lines = []
          lrc_entries = []
          
          lyrics_lines.append(f"Title: {song_title}")
          lyrics_lines.append(f"Lyricist: {lyricist_name}")
          lyrics_lines.append("")

          lrc_entries.append(f"[ti:{song_title}]")
          lrc_entries.append(f"[ar:{lyricist_name}]")

          current_time = 3.0

          for i in range(num_sections):
              section_title = f"[Verse {i+1}]" if i < num_sections - 1 else "[Outro]"
              lyrics_lines.append(section_title)
              
              for _ in range(random.randint(2, 4)):
                  template = random.choice(templates)
                  line = template.format(
                      N=get_random_word('N'),
                      V=get_random_word('V'),
                      A=get_random_word('A'),
                      ADV=get_random_word('ADV')
                  )
                  
                  sub_lines = line.split('\n')
                  for sub in sub_lines:
                      lyrics_lines.append(sub)
                      
                      mm = int(current_time // 60)
                      ss = int(current_time % 60)
                      xx = int((current_time % 1) * 100)
                      timestamp = f"[{mm:02d}:{ss:02d}.{xx:02d}]"
                      lrc_entries.append(f"{timestamp}{sub}")
                      
                      current_time += random.uniform(2.5, 4.5)
              
              lyrics_lines.append("")

          # 4. ファイル名の決定と保存
          timestamp_str = datetime.now().strftime('%Y%m%d_%H%M%S')
          base_filename = f"song_{timestamp_str}"
          
          os.makedirs('lyrics', exist_ok=True)
          
          txt_path = f"lyrics/{base_filename}.txt"
          lrc_path = f"lyrics/{base_filename}.lrc"
          ddex_path = f"lyrics/ddex_{base_filename}.xml"

          with open(txt_path, 'w', encoding='utf-8') as f:
              f.write("\n".join(lyrics_lines))

          with open(lrc_path, 'w', encoding='utf-8') as f:
              f.write("\n".join(lrc_entries))

          # DDEX XMLの生成
          current_iso_time = datetime.now().isoformat()
          ddex_xml_content = f"""<?xml version="1.0" encoding="UTF-8"?>
          <ern:NewReleaseMessage xmlns:ern="http://ddex.net/xml/ern/43" xmlns:xs="http://www.w3.org/2001/XMLSchema" MessageSchemaVersionId="ern/43" LanguageAndScriptCode="en">
            <MessageHeader>
              <MessageId>MSG-{base_filename}</MessageId>
              <MessageSender>
                <PartyId>PADPIDA07829919997X</PartyId>
                <PartyName>
                    <FullName>Decline Music LLC. Pte. Co.,Ltd.S.p.A SAS</FullName>
                </PartyName>
              </MessageSender>
              <MessageRecipient>
                <PartyId>PADPIDA20829900121X</PartyId>
                <PartyName>
                    <FullName>KweiYametMusic</FullName>
                </PartyName>
              </MessageRecipient>
              <MessageCreatedDateTime>{current_iso_time}</MessageCreatedDateTime>
            </MessageHeader>
            <ResourceList>
              <SoundRecording>
                <SoundRecordingType>MusicalWorkSoundRecording</SoundRecordingType>
                <ResourceReference>A1</ResourceReference>
                <SoundRecordingEdition>
                    <PLine>
                       <Year>2026</Year>
                       <PLineText>2026 Decline Music LLC. Pte. Co.,Ltd.S.p.A SAS</PLineText>
                    </PLine>
                </SoundRecordingEdition>
                <SoundRecordingDetailsByTerritory>
                  <TerritoryCode>JP</TerritoryCode>
                  <Title>
                    <TitleText>{song_title}</TitleText>
                  </Title>
                  <DisplayArtist>
                    <PartyName>
                      <FullName>{lyricist_name}</FullName>
                    </PartyName>
                    <ArtistRole>MainArtist</ArtistRole>
                  </DisplayArtist>
                  <Contributor>
                    <PartyName>
                      <FullName>{lyricist_name}</FullName>
                    </PartyName>
                    <Role>Lyricist</Role>
                  </Contributor>
                </SoundRecordingDetailsByTerritory>
              </SoundRecording>
            </ResourceList>
            <ReleaseList>
              <Release>
                <ReleaseReference>R1</ReleaseReference>
                <ReleaseType>Album</ReleaseType>
                <ReleaseDetailsByTerritory>
                  <TerritoryCode>JP</TerritoryCode>
                  <Title>
                    <TitleText>{song_title}</TitleText>
                  </Title>
                  <DisplayArtist>
                    <PartyName>
                      <FullName>{lyricist_name}</FullName>
                    </PartyName>
                    <ArtistRole>MainArtist</ArtistRole>
                  </DisplayArtist>
                </ReleaseDetailsByTerritory>
              </Release>
            </ReleaseList>
          </ern:NewReleaseMessage>
          """

          with open(ddex_path, 'w', encoding='utf-8') as f:
              f.write(ddex_xml_content.strip())

          print(f"Generated: {txt_path}, {lrc_path} and {ddex_path}")
          EOF

      - name: Commit and Push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lyrics/
          git diff --quiet && git diff --cached --quiet || (git commit -m "Add newly generated lyrics, lrc and customized DDEX ERN 4.3 XML files" && git push)
