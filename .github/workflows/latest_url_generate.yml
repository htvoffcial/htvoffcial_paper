name: Update jsDelivr Links in READMIES.md

on:
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate jsDelivr Links and Update READMIES.md
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # ヒアドキュメントを使用して複数行の文字列を安全に変​​数へ格納
          export SNIPPET=$(cat <<EOF
          **ePub**
          \`\`\`markdown
          https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.epub
          \`\`\`

          [ePub](https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.epub)
          
          **PDF**
          \`\`\`markdown
          https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.pdf
          \`\`\`

          [PDF](https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.pdf)

          **LaTeX**
          \`\`\`markdown
          https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.tex
          \`\`\`

          [LaTeX](https://cdn.jsdelivr.net/gh/htvoffcial/htvoffcial_paper@${COMMIT_SHA}/README.tex)

          
          EOF
          )

          # Pythonスクリプトでマーカー間を置換
          python3 -c "
          import os
          import re

          # シェルの環境変数から文字列を取得
          snippet = os.environ.get('SNIPPET', '')
          
          with open('READMIES.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!-- JSDELIVR_LINKS_START -->.*?<!-- JSDELIVR_LINKS_END -->'
          replacement = f'<!-- JSDELIVR_LINKS_START -->\n{snippet}\n<!-- JSDELIVR_LINKS_END -->'
          
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('READMIES.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add READMIES.md
          # 変更がある場合のみコミット
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update jsDelivr links [skip ci]" && git push)
