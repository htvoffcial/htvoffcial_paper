name: Generate PDF, ePub, LaTeX from README

on:
  push:
    # どのファイルの更新でもトリガーするが、自動生成されたファイルによる無限ループは防ぐ
    paths-ignore:
      - 'README.pdf'
      - 'README.epub'
      - 'README.tex'
    
  workflow_dispatch:
# リポジトリにファイルを自動コミット・プッシュするための権限設定
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        # Pandoc本体と、PDF化・3段組に必要なLaTeX環境をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-xetex

      - name: Prepare 3-column LaTeX configuration
        # 3段組（multicol）を実現するためのLaTeXのパーツを一時ファイルとして生成
        run: |
          echo '\usepackage{multicol}' > header.tex
          echo '\setlength{\columnsep}{6mm}' >> header.tex
          echo '\begin{multicols}{3}' > before.tex
          echo '\end{multicols}' > after.tex

      - name: Generate LaTeX (README.tex)
        # 余白を狭め(margin=15mm)にし、ヘッダーと本文前後に3段組のコマンドを挿入
        run: |
          pandoc README.md -s -o README.tex \
            -V geometry:margin=15mm \
            -H header.tex -B before.tex -A after.tex

      - name: Generate PDF (README.pdf)
        # モダンなフォント処理ができるxelatexを使用してPDF化
        run: |
          pandoc README.md -s -o README.pdf --pdf-engine=xelatex \
            -V geometry:margin=15mm \
            -H header.tex -B before.tex -A after.tex

      - name: Generate ePub (README.epub)
        # ePubはリフロー型（画面サイズに合わせて文字が動く）なので3段組にせず標準出力
        run: |
          pandoc README.md -s -o README.epub

      - name: Commit and push generated files
        # 生成された3つのファイルをリポジトリへ自動コミット＆プッシュ
        run: |
          git config --local user.email "61141911+htvoffcial@users.noreply.github.com"
          git config --local user.name "htvoffcial"
          git add README.pdf README.tex README.epub
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # [skip ci] を入れることで、このコミットによって再度Actionが走るのを防ぐ
          git commit -m "docs: auto-generate PDF, ePub, LaTeX [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
