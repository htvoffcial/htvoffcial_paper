name: Genius Paper Engine(Polished)

on:
  schedule:
    # 毎日UTC 0:00 (日本時間 午前9時) に実行
    - cron: '0 */5 * * *'
  workflow_dispatch: # 手動で実行ボタンを押せるようにする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          token: ${{ secrets.MY_PAT }}
          
      - name: Generate next 10 words
        run: python scripts/generate_daily_paper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "htvoffcial"
          git config --global user.email "61141911+htvoffcial@users.noreply.github.com"
          git add README.md data/state.json
          git commit -m "docs: append 10 words to paper" || echo "No changes to commit"
          git push
